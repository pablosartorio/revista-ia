[project]
name = "revista-ia"
version = "0.2.0"
description = "Cóndor — revista de IA/tecnología/ciencia producida por una redacción multi-agente con checkpoint humano"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "jinja2>=3.1.6",
]

[project.scripts]
condor = "condor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["condor"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
